spring:
  application:
    name: Sea-Credit-Backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seacredit}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your@email.com}
    password: ${MAIL_PASSWORD:your-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000        # 1 hour
    refresh-expiration-ms: 86400000  # 24 hours

  upload:
    dir: ${UPLOAD_DIR:uploads/documents}

  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}

  features:
    fraud-detection: true
    email-notifications: true
    rate-limiting: true
    audit-logging: true
    caching: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.seabuhi.seacredit: DEBUG
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"

