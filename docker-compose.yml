version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: seacredit-db
    environment:
      POSTGRES_DB: seacredit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: seacredit-app
    depends_on:
      - db
    environment:
      - DB_URL=jdbc:postgresql://db:5432/seacredit
      - DB_USERNAME=postgres
      - DB_PASSWORD=your_db_password
      - JWT_SECRET=5A7134743777217A25432A462D4A614E645267556B58703273357638792F423F
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=Admin@12345
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=your@email.com
      - MAIL_PASSWORD=your_app_password
    ports:
      - "8080:8080"

volumes:
  postgres_data:
